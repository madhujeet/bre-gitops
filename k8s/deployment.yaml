apiVersion: apps/v1
kind: Deployment

metadata:
  name: mm-bre

spec:
  replicas: 3

  selector:
    matchLabels:
      app: mm-bre

  template:
    metadata:
      labels:
        app: mm-bre

    spec:
      containers:
        - name: mm-bre
          image: madhujeetk/mm-bre:cf33d27e25e42666bfb7c12cdc5bada461b9e8d9
          ports:
            - containerPort: 8081
